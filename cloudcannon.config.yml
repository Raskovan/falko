paths:
  uploads: uploads
  uploads_use_relative_path: false
  static: ''
  dam_uploads: ''
  dam_static: ''
  collections: ''
  data: _data
  layouts: _layouts
  includes: _includes
collections_config:
  posts:
    path: _posts
    output: true
    icon: notes
    create:
      path: >-
        [relative_base_path]/{date|year}-{date|month}-{date|day}-{title|slugify}.[ext]
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  pages:
    path: ''
    output: true
    filter: strict
    icon: notes
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  drafts:
    path: _drafts
    output: true
    icon: notes
    create:
      publish_to: posts
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
_inputs:
  categories:
    type: multiselect
    options:
      allow_create: true
      empty_type: array
    cascade: true
  tags:
    type: multiselect
    options:
      allow_create: true
      empty_type: array
    cascade: true
_select_data:
  blog-categories:
    - Книги
    - Фантастика
    - Расследования
    - Путешествия
    - Отец
  blog-tags:
    - РЭП-ОПЕРА
    - АНАРХО-ПЬЕСА
    - РАССКАЗЫ
    - СТАТЬИ И ИНТЕРВЬЮ
    - КОЛОНКА В АРТ-ХРОНИКЕ
    - БЛОГ НА ГРАНЯХ
    - БЛОГ НА МЕДИА-УДАРЕ
    - АНАРХО-БУДДИСТСКАЯ ПОВЕСТЬ
    - СОЦИАЛЬНАЯ УТОПИЯ
    - Путешествия
    - Отец
    - Книги
base_url: /falkov
timezone: Etc/UTC
